goals_grid_title: 'ຂໍ້ມູນຂອງພວກເຮົາສຳລັບຕົວຊີ້ວັດເປົ້າໝາຍການພັດທະນາແບບຍືນຍົງ'
goal_grid_description: ກະລຸນາຄລິກເປົ້າຫມາຍເພື່ອເບິ່ງຕົວຊີ້ວັດ.
indicator-5-3-4-title: ເປີເຊັນຂອງແມ່ຍິງ ທີ່ເກີດລູກກ່ອນອາຍຸ 15 ປີ ແລະ 18 ປີ
frontpage_intro_body: <a 
  href="https://www.un.org/sustainabledevelopment/sustainable-development-goals/">ເປົ້າໝາຍການພັດທະນາແບບຍືນຍົງ
  (SDGs)</a> ແມ່ນການຮຽກຮ້ອງລະດັບສາກົນ ເພື່ອດຳເນີນການລຶບລ້າງຄວາມທຸກຍາກ, 
  ປົກປ້ອງໜ່ວຍໂລກ ແລະ ປັບປຸງຊີວິດການເປັນຢູ່ ລວມທັງອະນາຄົດຂອງທຸກຄົນໃນທຸກຫົນແຫ່ງ. 
  ບັນດາປະເທດສະມາຊິກອົງການສະຫະປະຊາຊາດ ໄດ້ຮັບຮອງເອົາວາລະ 2030 
  ເພື່ອການພັດທະນາແບບຍືນຍົງ ເຊິ່ງປະກອບມີ 17 ເປົ້າໝາຍລະດັບໂລກ. ນອກຈາກນີ້, 
  ລັດຖະບານແຫ່ງ ສປປ ລາວ ຍັງໄດ້ຕົກລົງຮັບຮອງເອົາເປົ້າໝາຍການພັດທະນາແບບຍືນຍົງລະດັບຊາດ
  ເພື່ອຫຼຸດຜ່ອນຜົນກະທົບຈາກລະເບີດບໍ່ທັນແຕກ (UXO) ຕໍ່ກັບການພັດທະນາປະເທດ. 
  ເຊິ່ງເປົ້າໝາຍທີ 18 ນີ້ ໄດ້ຖືກເປີດຕົວຂຶ້ນໂດຍການເຂົ້າຮ່ວມຂອງ ທ່ານ ບັນ ກີ ມູນ 
  ເລຂາທິການໃຫຍ່ອົງການສະຫະປະຊາຊາດ ໃນລະຫວ່າງການເດີນທາງມາຢ້ຽມຢາມລາວ ໃນເດືອນກັນຍາ ປີ
  2016.
frontpage_intro_title: 18 ເປົ້າໝາຍການພັດທະນາແບບຍືນຍົງ ສຳລັບ ສປປ ລາວ
