REC_USE_LIM: "<p>ເຖິງວ່າແນວຄວາມຄິດກ່ຽວກັບແຮງງານເດັກຈະລວມເຖິງການເຮັດວຽກໃນກິດຈະກຳທີ່ມີລັກສະນະອັນຕະລາຍ,
  ແຕ່ເພື່ອຮັບປະກັນຄວາມສາມາດໃນການປຽບທຽບການຄາດຄະເນໃນໄລຍະເວລາຕ່າງໆ ແລະ ເພື່ອຫຼຸດຜ່ອນບັນຫາດ້ານຄຸນນະພາບຂອງຂໍ້ມູນ,
  ການເຮັດວຽກທີ່ເກີນກຳນົດຊົ່ວໂມງຕາມເກນອາຍຸສະເພາະແມ່ນຖືກນຳໃຊ້ເປັນຕົວຊີ້ບອກແທນສຳລັບວຽກທີ່ເປັນອັນຕະລາຍ
  ເພື່ອຈຸດປະສົງໃນການລາຍງານຕົວຊີ້ວັດ SDG 8.7.1. ຍັງມີຄວາມຈຳເປັນຕ້ອງໄດ້ມີການສຶກສາດ້ານວິທີການເພີ່ມເຕີມ
  ເພື່ອຢັ້ງຢືນຄຳຖາມທີ່ແນໃສ່ການລະບຸເດັກນ້ອຍທີ່ຢູ່ໃນສະພາບການເຮັດວຽກທີ່ເປັນອັນຕະລາຍໂດຍສະເພາະ.</p><p>ເຊັ່ນດຽວກັນ,
  ເຖິງວ່າຮູບແບບທີ່ຮ້າຍແຮງທີ່ສຸດຂອງແຮງງານເດັກນອກເໜືອຈາກວຽກທີ່ເປັນອັນຕະລາຍ ຍັງເປັນສ່ວນໜຶ່ງຂອງແນວຄວາມຄິດເລື່ອງແຮງງານເດັກໃນວົງກວ້າງ,
  ແຕ່ໃນປະຈຸບັນ ຂໍ້ມູນກ່ຽວກັບຮູບແບບທີ່ຮ້າຍແຮງທີ່ສຸດຂອງແຮງງານເດັກແມ່ນຍັງບໍ່ທັນຖືກເກັບກຳເຂົ້າໃນການສຳຫຼວດຄົວເຮືອນແບບປົກກະຕິ
  ເນື່ອງຈາກຄວາມຫຍຸ້ງຍາກໃນການວັດແທກໃຫ້ຖືກຕ້ອງ ແລະ ເຊື່ອຖືໄດ້. ດັ່ງນັ້ນ, ອົງປະກອບຂອງແຮງງານເດັກນີ້ຈຶ່ງບໍ່ຖືກເກັບກຳໂດຍຕົວຊີ້ວັດທີ່ໃຊ້ສຳລັບການລາຍງານ
  SDG 8.7.1.</p><p>ນອກຈາກນັ້ນ, 'ການຜະລິດສິນຄ້າເພື່ອຊົມໃຊ້ເອງ', ເຊິ່ງລວມມີກິດຈະກຳຕ່າງໆ
  ເຊັ່ນ: ການໄປຕັກນ້ຳ ແລະ ການຫາຟືນ, ແມ່ນຕົກຢູ່ໃນຂອບເຂດການຜະລິດທີ່ກຳນົດໂດຍ ລະບົບບັນຊີແຫ່ງຊາດ
  (SNA) ຂອງອົງການສະຫະປະຊາຊາດ. ແນວໃດກໍຕາມ, ເພື່ອຈຸດປະສົງໃນການລາຍງານຕົວຊີ້ວັດ SDG 8.7.1
  ແລະ ເພື່ອເປົ້າໝາຍໃນການອຳນວຍຄວາມສະດວກໃຫ້ແກ່ການປຽບທຽບລະຫວ່າງປະເທດ, ການໄປຕັກນ້ຳ ແລະ
  ການຫາຟືນໄດ້ຖືກຈັດປະເພດເປັນການບໍລິການໃນຄົວເຮືອນທີ່ບໍ່ໄດ້ຮັບຄ່າຈ້າງ (ເຊັ່ນ: ວຽກເຮືອນ),
  ເຊິ່ງເປັນຮູບແບບການຜະລິດທີ່ຢູ່ນອກຂອບເຂດການຜະລິດຂອງ SNA.</p><p>ໃນວົງກວ້າງ, ການຄາດຄະເນແຮງງານເດັກໂດຍອີງໃສ່ມາດຕະຖານສະຖິຕິທີ່ກຳນົດໄວ້ໃນມະຕິຂອງ
  ICLS ແມ່ນເປັນເກນມາດຕະຖານທີ່ມີປະໂຫຍດສຳລັບຈຸດປະສົງການປຽບທຽບລະຫວ່າງປະເທດ ແຕ່ <u>ບໍ່</u>
  ຈຳເປັນຕ້ອງສອດຄ່ອງກັບການຄາດຄະເນໂດຍອີງໃສ່ກົດໝາຍແຫ່ງຊາດວ່າດ້ວຍແຮງງານເດັກ. ສັນຍາສາກົນຂອງ
  ILO ສະບັບເລກທີ 138 ປະກອບມີຂໍ້ກຳນົດທີ່ມີຄວາມຢືດຢຸ່ນຫຼາຍຂໍ້ ທີ່ປ່ອຍໃຫ້ເປັນການຕັດສິນໃຈຂອງອົງການຈັດຕັ້ງທີ່ມີສິດອຳນາດຂອງຊາດ
  ໂດຍມີການປຶກສາຫາລື (ໃນກໍລະນີທີ່ກ່ຽວຂ້ອງ) ກັບອົງການຈັດຕັ້ງຂອງຜູ້ອອກແຮງງານ ແລະ ຜູ້ໃຊ້ແຮງງານ
  (ຕົວຢ່າງ: ອາຍຸຕ່ຳສຸດ, ຂອບເຂດຂອງການນຳໃຊ້).<sup><a href=\"#footnote-4\" id=\"footnote-ref-4\"\
  >[4]</a></sup> ນີ້ໝາຍຄວາມວ່າ ບໍ່ມີຄຳນິຍາມທາງກົດໝາຍດຽວສຳລັບແຮງງານເດັກໃນທົ່ວທຸກປະເທດ,
  ແລະ ດັ່ງນັ້ນ, ຈຶ່ງບໍ່ມີມາດຕະການທາງສະຖິຕິດຽວຂອງແຮງງານເດັກທີ່ສອດຄ່ອງກັບກົດໝາຍແຫ່ງຊາດໃນທົ່ວທຸກປະເທດ.</p><div
  class=\"footnotes\"><div><sup class=\"footnote-number\" id=\"footnote-4\">4</sup><p>
  ຂົງເຂດຕົ້ນຕໍຂອງຄວາມຢືດຢຸ່ນໃນສັນຍາສາກົນລວມມີ: (ກ) <em>ອາຍຸຕ່ຳສຸດ</em>: ປະເທດສະມາຊິກທີ່ເສດຖະກິດ
