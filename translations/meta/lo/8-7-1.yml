  (ຂ) <em>ຂອບເຂດຂອງການນຳໃຊ້</em>: ປະເທດສະມາຊິກອາດຈະຍົກເວັ້ນການນຳໃຊ້ສັນຍາສາກົນກັບບາງປະເພດການຈ້າງງານ
