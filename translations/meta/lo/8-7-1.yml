REC_USE_LIM: "<p> ໃນຂະນະທີ່ແນວຄວາມຄິດຂອງແຮງງານເດັກແມ່ນລວມເຖິງການເຮັດວຽກໃນກິດຈະກໍາທີ່ເປັນອັນຕະລາຍໃນທໍາມະຊາດ,
  ເພື່ອຮັບປະກັນການປຽບທຽບການຄາດຄະເນເມື່ອເວລາຜ່ານໄປແລະເພື່ອຫຼຸດຜ່ອນບັນຫາຄຸນນະພາບຂໍ້ມູນ,
  ການເຮັດວຽກເກີນຂອບເຂດປະຈໍາຊົ່ວໂມງສະເພາະອາຍຸແມ່ນຖືກນໍາໃຊ້ເປັນຕົວແທນສໍາລັບການເຮັດວຽກທີ່ເປັນອັນຕະລາຍເພື່ອຈຸດປະສົງຂອງການລາຍງານກ່ຽວກັບຕົວຊີ້ວັດ
  SDG 8.7.1. ຕ້ອງ ມີ ວຽກ ງານ ວິ ທີ ການ ເພີ່ມ ເຕີມ ເພື່ອ ກວດ ສອບ ຄໍາ ຖາມ ໂດຍ ສະ ເພາະ
  ແມ່ນ ແນ ໃສ່ ການ ຊີ້ ບອກ ເດັກ ນ້ອຍ ໃນ ສະ ພາບ ການ ເຮັດ ວຽກ ທີ່ ເປັນ ອັນ ຕະ ລາຍ. </p>
  <p> ຄ້າຍຄື ກັນ ນີ້, ເຖິງ ແມ່ນ ວ່າ ການ ອອກ ແຮງ ງານ ຂອງ ເດັກ ທີ່ ຮ້າຍ ແຮງ ທີ່ ສຸດ
  ນອກ ຈາກ ເປັນ ອັນ ຕະ ລາຍ ຍັງ ເປັນ ສ່ວນ ຫນຶ່ງ ຂອງ ແນວ ຄວາມ ຄິດ ຂອງ ການ ອອກ ແຮງ ງານ
  ຂອງ ເດັກ ຢ່າງ ກວ້າງ ຂວາງ, ແຕ່ ຂໍ້ ມູນ ກ່ຽວ ກັບ ການ ອອກ ແຮງ ງານ ຂອງ ເດັກ ໃນ ຮູບ ແບບ
