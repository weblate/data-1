RATIONALE: <p> ເດັກນ້ອຍ ຫລາຍ ເກີນ ໄປ ໃນ ໂລກ ຍັງ ຕົກ ຢູ່ ໃນ ການ ອອກ ແຮງ ງານ ຂອງ 
  ເດັກນ້ອຍ, ປະ ເຊີນ ກັບ ອະນາຄົດ ສ່ວນ ຕົວ ຂອງ ເຂົາ ເຈົ້າ ແລະ ອະນາຄົດ ຮ່ວມ ກັນ ຂອງ
  ເຮົາ. ອີງຕາມການຄາດຄະເນຫຼ້າສຸດຂອງ ILO ທົ່ວໂລກ, ເດັກນ້ອຍປະມານ 152 ລ້ານຄົນທົ່ວໂລກ
  – ເດັກຍິງ 64 ລ້ານຄົນ ແລະ ເດັກຊາຍ 88 ລ້ານຄົນ - ແມ່ນຜູ້ອອກແຮງງານເດັກ, 
  ຄິດເປັນເກືອບ 10 ເປີເຊັນຂອງປະຊາກອນເດັກ.  ຕົວ ເລກ ທີ່ ສໍາຄັນ ເຫລົ່າ ນີ້ ເນັ້ນ 
  ເຖິງ ຄວາມ ຈໍາ ເປັນ ທີ່ ຈະ ຕ້ອງ ມີ ຄວາມ ກ້າວຫນ້າ ຢ່າງ ວ່ອງ ໄວ ຕໍ່ ແຮງ ງານ ຂອງ 
  ເດັກ ໃນ ການ ນໍາພາ ຈົນ ເຖິງ ວັນ ທີ ເປົ້າ ຫມາຍ ປີ 2025 ສໍາລັບ ການ ສິ້ນ ສຸດ ແຮງ 
  ງານ ຂອງ ເດັກ ໃນ ທຸກ ຮູບ ແບບ ແລະ ຄວາມ ຈໍາ ເປັນ ທີ່ ຈະ ຕ້ອງ ມີ ສະຖິຕິ ແຮງ ງານ 
  ຂອງ ເດັກ ເພື່ອ ຕິດຕາມ ກວດກາ ແລະ ນໍາພາ ຄວາມ ພະຍາຍາມ ໃນ ເລື່ອງ ນີ້.  ຂໍ້ ມູນ ທີ່
  ເຊື່ອ ຖື ໄດ້, ກວ້າງ ຂວາງ ແລະ ທັນ ເວ ລາ ກ່ຽວ ກັບ ທໍາ ມະ ຊາດ ແລະ ຂອບ ເຂດ ຂອງ ການ
  ອອກ ແຮງ ງານ ເດັກ ໃຫ້ ເປັນ ພື້ນ ຖານ ໃນ ການ ກໍາ ນົດ ລໍາ ດັບ ຄວາມ ສໍາ ຄັນ ສໍາ ລັບ
  ການ ກະ ທໍາ ທົ່ວ ໂລກ ຕໍ່ ຕ້ານ ການ ອອກ ແຮງ ງານ ຂອງ ເດັກ. 
  ຂໍ້ມູນສະຖິຕິກ່ຽວກັບແຮງງານເດັກ, ແລະ 
  ກວ້າງຂວາງກວ່າເກົ່າກ່ຽວກັບເດັກທີ່ເຮັດວຽກທັງຫມົດ, 
  ຍັງເປັນພື້ນຖານໃຫ້ແກ່ການເພີ່ມທະວີຄວາມຮັບຮູ້ຂອງປະຊາຊົນກ່ຽວກັບສະພາບການຂອງເດັກທີ່ເຮັດວຽກ
  ແລະ ສໍາລັບການພັດທະນາໂຄງຮ່າງລະບຽບການ ແລະ ນະໂຍບາຍທີ່ເຫມາະສົມ. </p>
