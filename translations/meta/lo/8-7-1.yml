  (ມາດຕາ 4.1). ປະເທດສະມາຊິກທີ່ເສດຖະກິດ ແລະ ສິ່ງອຳນວຍຄວາມສະດວກດ້ານການບໍລິຫານຍັງພັດທະນາບໍ່ທັນພຽງພໍ
