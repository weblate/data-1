  ວັກ 21 ເຖິງ 32). ການອອກແຮງງານເດັກໃນຮູບແບບທີ່ຮ້າຍແຮງທີ່ສຸດລວມມີທຸກຮູບແບບຂອງການເປັນຂ້າທາດຫຼືການປະຕິບັດທີ່ຄ້າຍຄືກັນເຊັ່ນ:
  ການຄ້າແລະການຈ້າງງານແລະການນໍາໃຊ້ທະຫານເດັກ, ການໃຊ້ຫຼືການຈັດຊື້ເດັກສໍາລັບການຄ້າປະເວນີຫຼືກິດຈະກໍາອື່ນໆທີ່ຜິດກົດຫມາຍ,
  ແລະວຽກງານອື່ນໆທີ່ອາດຈະເປັນອັນຕະລາຍຕໍ່ສຸຂະພາບຂອງເດັກ, ຄວາມປອດໄພຫຼືຄວາມຢູ່ດີກິນດີ.
  </p> <div class="footnotes"> <div> <sup class="footnote-number" id="footnote-2">2</sup><p>
