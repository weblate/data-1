STAT_CONC_DEF: '<p> <strong> ນິຍາມ:</strong></p><p><p>ຈໍານວນເດັກນ້ອຍທີ່ມີສ່ວນຮ່ວມໃນການອອກແຮງງານເດັກແມ່ນສອດຄ່ອງກັບຈໍານວນເດັກນ້ອຍທີ່ລາຍງານວ່າຢູ່ໃນການອອກແຮງງານເດັກໃນໄລຍະການອ້າງອີງ
  (ປົກກະຕິແລ້ວອາທິດກ່ອນການສໍາຫຼວດ). ອັດຕາສ່ວນຂອງເດັກໃນການອອກແຮງງານເດັກແມ່ນຄິດໄລ່ເປັນຈໍານວນເດັກນ້ອຍໃນການອອກແຮງງານເດັກແບ່ງອອກໂດຍຈໍານວນເດັກນ້ອຍທັງຫມົດໃນຈໍານວນປະຊາກອນ.  ສໍາລັບຈຸດປະສົງຂອງຕົວຊີ້ວັດນີ້,
  ເດັກນ້ອຍລວມມີທຸກຄົນທີ່ມີອາຍຸ 5 ຫາ 17 ປີ. ) . </p> <p> <strong> ແນວຄວາມຄິດ:</strong></p><p><p>ສາມເຄື່ອງມືກົດຫມາຍສາກົນຫຼັກ
  – ILO Convention No. 138 (ອາຍຸຕ່ໍາສຸດ) (C138), ສົນທິສັນຍາສາກົນວ່າດ້ວຍສິດທິເດັກ (CRC),
  ILO Convention No. 182 (Worst Forms) (C182) ພ້ອມກັນກໍານົດຂອບເຂດກົດຫມາຍສໍາລັບແຮງງານເດັກ,
  ແລະໃຫ້ພື້ນຖານທາງດ້ານກົດຫມາຍສໍາລັບການກະທໍາຂອງຊາດແລະສາກົນຕໍ່ຕ້ານ.  ອີງຕາມເຄື່ອງມືເຫຼົ່ານີ້,
  ແຮງງານເດັກແມ່ນວຽກທີ່ເດັກນ້ອຍຄວນ <em>ບໍ່ </em>ເຮັດເພາະ (ກ) ພວກເຂົາຍັງນ້ອຍເກີນໄປຫຼື
  (b) ຈະເປັນອັນຕະລາຍຕໍ່ສຸຂະພາບ, ຄວາມປອດໄພຫຼືສິນທໍາຂອງເຂົາເຈົ້າ, ເນື່ອງຈາກທໍາມະຊາດຫຼືເງື່ອນໄຂທີ່ມັນດໍາເນີນ.
  </p> <p> ມະຕິທີ່ກອງປະຊຸມສາກົນຂອງນັກສະຖິຕິແຮງງານ (ICLS) ທີ່ໄດ້ຮັບການຍອມຮັບຂອງໂລກໃນຂອບເຂດສະຖິຕິແຮງງານ,
  ໃຫ້ພື້ນຖານໃນການແປມາດຕະຖານທາງດ້ານກົດຫມາຍກ່ຽວກັບແນວຄວາມຄິດຂອງແຮງງານເດັກໃຫ້ເປັນເງື່ອນໄຂທາງສະຖິຕິເພື່ອຈຸດປະສົງຂອງການວັດແທກແຮງງານເດັກ.
  </p> <p> ໂດຍອີງຕາມການແກ້ໄຂຂອງ ICLS<sup><a href="#footnote-2" id="footnote-ref-2">[2]</a></sup>,
  ແຮງງານເດັກສາມາດວັດແທກໄດ້ບົນພື້ນຖານຂອບເຂດການຜະລິດທີ່ກໍານົດໂດຍອົງການສະຫະປະຊາຊາດຂອງບັນຊີແຫ່ງຊາດ
  (SNA) ຫຼືບົນພື້ນຖານຂອບເຂດການຜະລິດທົ່ວໄປ. ເມື່ອກ່ອນຈໍາກັດໂຄງປະກອບການອ້າງອີງເຖິງກິດຈະກໍາເສດຖະກິດ,
  ສ່ວນຫຼ້າສຸດຂະຫຍາຍໃຫ້ລວມທັງກິດຈະກໍາເສດຖະກິດ <em>ແລະ</em> ການບໍລິການໃນຄົວເຮືອນທີ່ບໍ່ໄດ້ຮັບຄ່າຈ້າງ,
  ນັ້ນແມ່ນການຜະລິດການບໍລິການພາຍໃນແລະສ່ວນຕົວໂດຍສະມາຊິກໃນຄົວເຮືອນສໍາລັບການບໍລິໂພກພາຍໃນຄົວເຮືອນຂອງຕົນເອງ,
  ເຊິ່ງທົ່ວໄປເອີ້ນວ່າ "ວຽກເຮັດງານທໍາໃນຄົວເຮືອນ". </p> <p> ຕິດຕາມຈາກນີ້, ສອງຕົວຊີ້ວັດແມ່ນນໍາໃຊ້ສໍາລັບການວັດແທກແຮງງານເດັກເພື່ອຈຸດປະສົງຂອງການລາຍງານ
  SDG, ເປັນຄັ້ງທໍາອິດໂດຍອີງໃສ່ຂອບເຂດການຜະລິດທີ່ກໍານົດໂດຍລະບົບອົງການສະຫະປະຊາຊາດຂອງບັນຊີແຫ່ງຊາດ
  (SNA) ແລະອັນທີສອງໂດຍອີງໃສ່ຂອບເຂດການຜະລິດທົ່ວໄປ. </p> <p> ຕົວຊີ້ວັດທີ 1: ອັດຕາສ່ວນ
  ແລະ ຈໍານວນເດັກອາຍຸ 5-17 ປີ ມີສ່ວນຮ່ວມໃນກິດຈະກໍາເສດຖະກິດໃນຫຼືສູງກວ່າເກນປະຈໍາຊົ່ວໂມງສະເພາະອາຍຸ
  (<strong>SNA ຂອບເຂດຂອບເຂດການຜະລິດ</strong>[) </p> <p> <p><p><em><em></em>: ເດັກນ້ອຍທີ່ເຮັດວຽກຢ່າງຫນ້ອຍ
  1 ຊົ່ວໂມງຕໍ່ອາທິດໃນກິດຈະກໍາເສດຖະກິດ; ເດັກນ້ອຍທີ່ເຮັດວຽກຢ່າງຫນ້ອຍ 1 ຊົ່ວໂມງຕໍ່ອາທິດໃນກິດຈະກໍາເສດຖະກິດ;
  ເດັກນ້ອຍທີ່ເຮັດວຽກຢ່າງຫນ້ອຍ 1 ຊົ່ວໂມງຕໍ່ອາທິດໃນກິດຈະກໍາເສດຖະກິດ; ເດັກນ້ອຍທີ່ເຮັດວຽກຢ່າງຫນ້ອຍ
