RATIONALE: 
  <p>ມີເດັກນ້ອຍຈຳນວນຫຼວງຫຼາຍໃນໂລກທີ່ຍັງຕົກຢູ່ໃນວັງວົນຂອງການອອກແຮງງານເດັກ, 
  ເຊິ່ງສົ່ງຜົນກະທົບຕໍ່ອະນາຄົດສ່ວນຕົວຂອງພວກເຂົາ ແລະ ອະນາຄົດລວມຂອງພວກເຮົາ. 
  ອີງຕາມການຄາດຄະເນທົ່ວໂລກຫຼ້າສຸດຂອງອົງການ ILO, ມີເດັກນ້ອຍປະມານ 152 
  ລ້ານຄົນໃນທົ່ວໂລກ – ເປັນເດັກຍິງ 64 ລ້ານຄົນ ແລະ ເດັກຊາຍ 88 ລ້ານຄົນ - 
  ແມ່ນຜູ້ອອກແຮງງານເດັກ, ເຊິ່ງກວມເອົາເກືອບ 10 ສ່ວນຮ້ອຍຂອງປະຊາກອນເດັກທັງໝົດ. 
  ຕົວເລກທີ່ໜ້າຕົກໃຈເຫຼົ່ານີ້ໄດ້ເນັ້ນໃຫ້ເຫັນເຖິງຄວາມຈຳເປັນໃນການເລັ່ງລັດຄວາມຄືບໜ້າເພື່ອຕ້ານການອອກແຮງງານເດັກ
  ໃນໄລຍະກ່ອນຈະຮອດກຳນົດເວລາເປົ້າໝາຍປີ 2025 ເພື່ອຢຸດຕິການອອກແຮງງານເດັກໃນທຸກຮູບແບບ,
  ແລະ ຄວາມຕ້ອງການຂໍ້ມູນສະຖິຕິດ້ານການອອກແຮງງານເດັກ ເພື່ອຕິດຕາມ ແລະ 
  ຊີ້ນຳວຽກງານໃນດ້ານນີ້. ຂໍ້ມູນທີ່ໜ້າເຊື່ອຖື, ຮອບດ້ານ ແລະ ທັນການ ກ່ຽວກັບລັກສະນະ 
  ແລະ ຂອບເຂດຂອງການອອກແຮງງານເດັກ 
  ຈະເປັນພື້ນຖານໃຫ້ແກ່ການກຳນົດບຸລິມະສິດສຳລັບການຈັດຕັ້ງປະຕິບັດວຽກງານຕ້ານການອອກແຮງງານເດັກທັງໃນລະດັບຊາດ
  ແລະ ສາກົນ. ຂໍ້ມູນສະຖິຕິກ່ຽວກັບການອອກແຮງງານເດັກ, ແລະ 
  ໃນວົງກວ້າງແມ່ນກ່ຽວກັບເດັກນ້ອຍທີ່ເຮັດວຽກທັງໝົດ, 
  ຍັງເປັນພື້ນຖານໃນການສ້າງຈິດສຳນຶກໃຫ້ແກ່ສາທາລະນະຊົນກ່ຽວກັບສະພາບການຂອງເດັກນ້ອຍທີ່ເຮັດວຽກ
  ແລະ ເພື່ອການພັດທະນາຂອບລະບຽບການ ແລະ ນະໂຍບາຍທີ່ເໝາະສົມ.</p>
