SDG_RELATED_INDICATORS: '<p>ເປົ້າໝາຍທີ 2: ຍຸດຕິຄວາມອຶດຫິວ, ບັນລຸຄວາມໝັ້ນຄົງດ້ານສະບຽງອາຫານ,
  ປັບປຸງໂພຊະນາການ ແລະ ສົ່ງເສີມກະສິກຳແບບຍືນຍົງ </p>'
SDG_TARGET: '<p>2.1: ຮອດປີ 2030, ຍຸດຕິຄວາມອຶດຫິວ ແລະ ຮັບປະກັນໃຫ້ທຸກຄົນ ໂດຍສະເພາະຄົນທຸກຍາກ
  ແລະ ຜູ້ທີ່ຢູ່ໃນສະຖານະການບອບບາງ ລວມທັງເດັກອ່ອນ ໄດ້ເຂົ້າເຖິງອາຫານທີ່ປອດໄພ, ມີໂພຊະນາການ
  ແລະ ພຽງພໍຕະຫຼອດປີ </p>'
STAT_CONC_DEF: '<p><strong>ນິຍາມ: </strong>ອັດຕາຄວາມແຜ່ຫຼາຍຂອງການຂາດສານອາຫານ (PoU)
  ແມ່ນການຄາດຄະເນອັດຕາສ່ວນຂອງປະຊາກອນ ທີ່ການບໍລິໂພກອາຫານເປັນປະຈຳ ບໍ່ພຽງພໍທີ່ຈະສະໜອງລະດັບພະລັງງານອາຫານທີ່ຈຳເປັນ
  ເພື່ອຮັກສາການດຳລົງຊີວິດທີ່ແຂງແຮງ ແລະ ມີການເຄື່ອນໄຫວເປັນປົກກະຕິ. ຕົວຊີ້ວັດນີ້ສະແດງອອກເປັນເປີເຊັນ.
  </p><p><strong>ແນວຄວາມຄິດ: </strong>ການຂາດສານອາຫານ (Undernourishment) ຖືກກຳນົດວ່າເປັນສະພາວະທີ່ບຸກຄົນສາມາດເຂົ້າເຖິງອາຫານເປັນປະຈຳ
  ໃນປະລິມານທີ່ບໍ່ພຽງພໍກັບຄວາມຕ້ອງການພະລັງງານ ເພື່ອການດຳລົງຊີວິດທີ່ເປັນປົກກະຕິ ແລະ
  ແຂງແຮງ. </p><p>ເຖິງວ່າຈະມີຄວາມກ່ຽວຂ້ອງກັນຢ່າງໃກ້ຊິດ, ແຕ່ "ການຂາດສານອາຫານ" ໃນທີ່ນີ້ແມ່ນແຕກຕ່າງຈາກສະພາວະທາງກາຍະພາບຂອງ
  "ພາວະທຸພໂພຊະນາການ" (malnutrition) ເພາະມັນໝາຍເຖິງສະພາວະຂອງການໄດ້ຮັບອາຫານບໍ່ພຽງພໍ
  ຫຼາຍກວ່າຈະໝາຍເຖິງຜົນໄດ້ຮັບທາງດ້ານສະຖານະໂພຊະນາການ. </p><p>ໃນຂະນະທີ່ສະພາວະການຂາດສານອາຫານເກີດຂຶ້ນກັບບຸກຄົນ,
  ແຕ່ເນື່ອງຈາກເຫດຜົນດ້ານແນວຄວາມຄິດ ແລະ ຂໍ້ມູນ, ຕົວຊີ້ວັດນີ້ສາມາດອ້າງອີງໄດ້ສະເພາະໃນລະດັບປະຊາກອນ
  ຫຼື ກຸ່ມບຸກຄົນເທົ່ານັ້ນ. ດັ່ງນັ້ນ, ອັດຕາຄວາມແຜ່ຫຼາຍຂອງການຂາດສານອາຫານ ຈຶ່ງແມ່ນການຄາດຄະເນສ່ວນຮ້ອຍຂອງບຸກຄົນໃນກຸ່ມທີ່ຢູ່ໃນສະພາວະດັ່ງກ່າວ,
  ແຕ່ບໍ່ສາມາດລະບຸໄດ້ວ່າບຸກຄົນໃດໃນກຸ່ມນັ້ນເປັນຜູ້ຂາດສານອາຫານແທ້. </p>'
