DATA_COMP: '<p>ຕົວຊີ້ວັດນີ້ຖືກຄິດໄລ່ໃນລະດັບປະຊາກອນ. ເພື່ອບັນລຸຈຸດປະສົງນີ້, ປະຊາກອນແມ່ນຖືກຕາງໜ້າໂດຍບຸກຄົນ
  "ສະເລ່ຍ" ເຊິ່ງການກະຈາຍຄວາມເປັນໄປໄດ້ຂອງລະດັບການບໍລິໂພກພະລັງງານອາຫານປະຈຳວັນ ແມ່ນຖືກສ້າງແບບຈຳລອງຜ່ານຟັງຊັນຄວາມໜາແໜ້ນຂອງຄວາມເປັນໄປໄດ້
  (pdf). </p><p>ເມື່ອໄດ້ກຳນົດຄ່າ pdf ແລ້ວ, ຕົວຊີ້ວັດຈະໄດ້ມາຈາກຄວາມເປັນໄປໄດ້ທີ່ສະສົມ
  ເຊິ່ງການບໍລິໂພກພະລັງງານອາຫານປະຈຳວັນ (x) ແມ່ນຕ່ຳກວ່າເກນຕ່ຳສຸດຂອງຄວາມຕ້ອງການພະລັງງານອາຫານປົກກະຕິ
  ສຳລັບບຸກຄົນຕາງໜ້າ ຫຼື ບຸກຄົນສະເລ່ຍ (MDER), ດັ່ງໃນສູດລຸ່ມນີ້: </p><p>PoU= ∫_(x&lt;MDER)
  f(x | DEC; CV) dx </p><p>ໂດຍທີ່ DEC ແລະ CV ແມ່ນຄ່າສະເລ່ຍ ແລະ ສຳປະສິດການຜັນປ່ຽນ ທີ່ກຳນົດລັກສະນະການກະຈາຍຂອງລະດັບການບໍລິໂພກພະລັງງານອາຫານໃນປະຊາກອນ.
  </p><p>ສຳລັບລາຍລະອຽດດ້ານວິທີການ, ກະລຸນາເບິ່ງເອກະສານທີ່ໃຫ້ໄວ້ໃນພາກສ່ວນເອກະສານອ້າງອີງ.</p>'
