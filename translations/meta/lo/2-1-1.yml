RATIONALE: 
  <p>ຕົວຊີ້ວັດນີ້ຊ່ວຍໃຫ້ສາມາດຕິດຕາມແນວໂນ້ມຂອບເຂດຄວາມບໍ່ພຽງພໍຂອງພະລັງງານອາຫານໃນປະຊາກອນເມື່ອເວລາຜ່ານໄປ,
  ເຊິ່ງເປັນຜົນມາຈາກການປະສົມປະສານລະຫວ່າງ ການປ່ຽນແປງຂອງການມີອາຫານໂດຍລວມ, 
  ຄວາມສາມາດຂອງຄົວເຮືອນໃນການເຂົ້າເຖິງອາຫານ, ແລະ ຄຸນລັກສະນະທາງສັງຄົມ-ປະຊາກອນ 
