  FAO ສຳລັບການຄາດຄະເນ </p><p>ຕົວຊີ້ວັດອັດຕາຄວາມແຜ່ຫຼາຍຂອງການຂາດສານອາຫານ <br/><a href="http://www.fao.org/3/a-i4046e.pdf">http://www.fao.org/3/a-i4046e.pdf</a></p><p>ເອກະສານຫຼັກ:
  ວິທີການຂອງ FAO ສຳລັບການຄາດຄະເນອັດຕາຄວາມແຜ່ຫຼາຍຂອງການຂາດສານອາຫານ</p><p><a href="http://www.fao.org/docrep/005/Y4249E/y4249e06.htm#bm06">http://www.fao.org/docrep/005/Y4249E/y4249e06.htm#bm06</a>
