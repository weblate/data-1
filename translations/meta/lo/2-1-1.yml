COLL_METHOD: "<p>ຂໍ້ມູນທາງການກ່ຽວກັບການຜະລິດ, ການຄ້າ ແລະ ການນຳໃຊ້ສິນຄ້າສະບຽງອາຫານ
  ທີ່ FAO ນຳໃຊ້ເພື່ອຮຽບຮຽງຕາຕະລາງສົມດຸນສະບຽງອາຫານ (Food Balance Sheets) ແມ່ນໄດ້ຮັບການສະໜອງສ່ວນໃຫຍ່ຈາກໜ່ວຍງານສະຖິຕິຂອງກະຊວງກະສິກຳ.
  FAO ຈະສົ່ງແບບສອບຖາມເກັບກຳຂໍ້ມູນໃນທຸກໆປີໄປຫາຈຸດປະສານງານທີ່ໄດ້ກຳນົດໄວ້. </p><p>ການຄາດຄະເນແມ່ນອີງໃສ່ຂໍ້ມູນການສຳຫຼວດຄົວເຮືອນ.
  ເມື່ອມີຂໍ້ມູນ, FAO ຈະນຳໃຊ້ຂໍ້ມູນໂດຍກົງຜ່ານເວັບໄຊທ໌ຂອງອົງການສະຖິຕິແຫ່ງຊາດ (NSA).
  ໃນຫຼາຍກໍລະນີ, ເມື່ອຂໍ້ມູນຈຸນລະພາກ (microdata) ບໍ່ມີຢູ່ໃນຂອບເຂດສາທາລະນະ, ໄດ້ມີການເຊັນສັນຍາສອງຝ່າຍ,
  ເຊິ່ງປົກກະຕິແລ້ວແມ່ນຢູ່ໃນຂອບການຊ່ວຍເຫຼືອທາງດ້ານເຕັກນິກ ແລະ ໂຄງການພັດທະນາຂີດຄວາມສາມາດ.
  </p><p>ຂະໜາດ ແລະ ໂຄງສ້າງຂອງປະຊາກອນ ແມ່ນໄດ້ມາຈາກການຄາດຄະເນລະດັບຊາດ ແລະ ໄດ້ຮັບການກວດສອບຢັ້ງຢືນດ້ວຍຂໍ້ມູນຈາກພາກສ່ວນກວດກາປະຊາກອນໂລກ
  ຂອງອົງການສະຫະປະຊາຊາດ. \t</p>"
