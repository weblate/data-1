COLL_METHOD: '<p>ການສຳຫຼວດ LECS ສົກປີ 2018-2019 ແມ່ນການສຳຫຼວດຄັ້ງທີ VI ແລະ ເປັນຄັ້ງຫຼ້າສຸດທີ່ໄດ້ຈັດຕັ້ງປະຕິບັດຢູ່
  ສປປ ລາວ. </p><p><strong>ວິທີການ ແລະ ຂອບເຂດການສຳຫຼວດ</strong>: ການສຳຫຼວດແບບສຸ່ມຕົວຢ່າງ
  ແມ່ນໄດ້ດຳເນີນໃນທຸກແຂວງ (17 ແຂວງ) ແລະ ທຸກເມືອງ ໃນທົ່ວປະເທດ. </p><p><strong>ການເກັບກຳຂໍ້ມູນພາກສະໜາມ</strong>:
  12 ເດືອນ, ນັບແຕ່ເດືອນມິຖຸນາ 2018 ຫາ ເດືອນມິຖຸນາ 2019 (ຫຼ້າສຸດ)</p><p><em>ຂໍ້ມູນລາຍຈ່າຍ
  ແລະ ລາຍຮັບຂອງຄົວເຮືອນ</em> ແມ່ນໄດ້ເກັບກຳໃນແຕ່ລະເດືອນ ໂດຍນຳໃຊ້ຫຼັກການຈົດກ່າຍປະຈຳວັນ.
  ທຸກໆການເຄື່ອນໄຫວແມ່ນໄດ້ຖືກບັນທຶກໄວ້ໃນປຶ້ມບັນທຶກປະຈຳວັນ ແລະ ຈັດປະເພດຕາມປະເພດການຊົມໃຊ້,
  ຫຼື ຕາມຜົນຜະລິດກະສິກຳ ແລະ ທຸລະກິດຂອງຄົວເຮືອນ. <em>ຂໍ້ມູນກ່ຽວກັບການຊື້ສິນຄ້າ</em>
  ທີ່ມີອາຍຸການນຳໃຊ້ຍາວນານ (ສິນຄ້າຄົງທົນ) ເຊັ່ນ: ເຄື່ອງເຟີນີເຈີ, ໂທລະພາບ, ລົດຍົນ, ລົດຈັກ
  ແລະ ອື່ນໆ ແມ່ນໄດ້ຖືກບັນທຶກໄວ້ສຳລັບໄລຍະ 12 ເດືອນຜ່ານມາ. <em>ຂໍ້ມູນກ່ຽວກັບການນຳໃຊ້ເວລາ</em>
  ແມ່ນໄດ້ເກັບກຳໃນຊ່ວງກາງເດືອນ ສຳລັບສະມາຊິກຄົວເຮືອນທັງໝົດ ທີ່ມີອາຍຸແຕ່ 10 ປີຂຶ້ນໄປ.</p><p><strong>ຮູບແບບການສຳພາດ:</strong>
  ການສຳພາດແບບເຊິ່ງໜ້າ </p><p><strong>ການຕິດຕາມກວດກາ:  </strong>ແຕ່ລະທີມປະກອບມີ ຜູ້ຕິດຕາມກວດກາ
  1 ທ່ານ ແລະ ພະນັກງານເກັບກຳຂໍ້ມູນ 2 ທ່ານ ສຳລັບແຕ່ລະບ້ານ. </p><p><strong>ໝາຍເຫດການເກັບກຳຂໍ້ມູນ:  </strong>ການຝຶກອົບຮົມສຳລັບຄູຝຶກ
  ແລະ ຜູ້ຕິດຕາມກວດກາ ແມ່ນໄດ້ຈັດຂຶ້ນເປັນເວລາ ຫ້າ (5) ວັນ ຢູ່ທີ່ ກົມສະຖິຕິ, ນະຄອນຫຼວງວຽງຈັນ,
  ໂດຍມີການເຂົ້າຮ່ວມຂອງພະນັກງານທັງໝົດຈາກ ຂະແໜງສະຖິຕິ ຈາກ 17 ແຂວງ. ການຝຶກອົບຮົມສຳລັບພະນັກງານເກັບກຳຂໍ້ມູນ
  ແມ່ນໃຊ້ເວລາ 11 ວັນ ເພື່ອກວມເອົາທັງໝົດ 17 ແຂວງ. </p><p><strong>ຂັ້ນຕອນການສຸ່ມຕົວຢ່າງ</strong>:
  ການອອກແບບ ແລະ ການຄັດເລືອກຕົວຢ່າງ (ການສຸ່ມຕົວຢ່າງແບບສອງຂັ້ນຕອນ)</p><p>ຂັ້ນຕອນທີໜຶ່ງ:
  ການອະທິບາຍບ້ານຕົວຢ່າງ; ຂັ້ນຕອນທີສອງ: ການຄັດເລືອກຄົວເຮືອນຕົວຢ່າງພາຍໃນບ້ານຕົວຢ່າງນັ້ນ</p><h2><strong>ແບບສອບຖາມ</strong></h2><p>ມີແບບສອບຖາມສີ່ປະເພດ
  ທີ່ຖືກນຳໃຊ້ເຂົ້າໃນການເກັບກຳຂໍ້ມູນ LECS VI ຄື:<br/>- ແບບສອບຖາມຄົວເຮືອນ<br/>- ປຶ້ມບັນທຶກປະຈຳວັນ<br/>-
  ແບບສອບຖາມການນຳໃຊ້ເວລາ<br/>- ແບບສອບຖາມຂັ້ນບ້ານ<br/>- ແບບສອບຖາມລາຄາ </p><p>ສຳລັບລາຍລະອຽດຂອງວິທີການ,
  ກະລຸນາເບິ່ງໃນບົດລາຍງານການສຳຫຼວດ </p><p>(ມີລິ້ງໃຫ້ໃນພາກເອກະສານອ້າງອີງ).</p>'
