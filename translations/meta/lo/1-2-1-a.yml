STAT_CONC_DEF: <p><strong>ນິຍາມ:</strong></p><p>ອັດຕາຄວາມທຸກຍາກແຫ່ງຊາດ 
  ແມ່ນເປີເຊັນຂອງປະຊາກອນທັງໝົດທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ. 
  ອັດຕາຄວາມທຸກຍາກໃນເຂດຊົນນະບົດ 
  ແມ່ນເປີເຊັນຂອງປະຊາກອນໃນເຂດຊົນນະບົດທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ. 
  ອັດຕາຄວາມທຸກຍາກໃນຕົວເມືອງ 
  ແມ່ນເປີເຊັນຂອງປະຊາກອນໃນຕົວເມືອງທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ. 
  </p><p><strong>ແນວຄວາມຄິດ:</strong></p><p>ໃນການປະເມີນຄວາມທຸກຍາກຢູ່ ສປປ ລາວ ແລະ
  ວິທີການທີ່ດີທີ່ສຸດໃນການຫຼຸດຜ່ອນຄວາມທຸກຍາກຕາມນິຍາມລະດັບຊາດ, 
  ແມ່ນເນັ້ນໃສ່ການມີເສັ້ນຄວາມທຸກຍາກທີ່ຖືວ່າເໝາະສົມກັບ ສປປ ລາວ. ເຊັ່ນດຽວກັນ, 
  ຢູ່ພາຍໃນ ສປປ ລາວ, ຄວາມແຕກຕ່າງຂອງຄ່າຄອງຊີບໃນແຕ່ລະແຂວງ ແລະ ລະຫວ່າງເຂດຕົວເມືອງ 
  ແລະ ຊົນນະບົດ 
  ຕ້ອງໄດ້ຮັບການນຳມາພິຈາລະນາເຂົ້າໃນການກຳນົດເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ.</p>
