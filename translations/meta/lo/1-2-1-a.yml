DATA_VALIDATION: <p> ຂັ້ນ ຕອນ ການ ປຶກ ສາ ຫາ ລື ກັບ ບັນ ດາ ບໍ ລິ ການ ເສັ້ນ ທາງ 
  ກ່ຽວ ກັບ ຂໍ້ ມູນ ແຫ່ງ ຊາດ ທີ່ ສົ່ງ ມາ ໃຫ້ ຕົວ ຊີ້ ວັດ SDGs ໄດ້ ດໍາ ເນີນ ໄປ 
  ກ່ອນ ການ ພິມ ຜົນ ໄດ້ ຮັບ. </p> <p> ເຊັ່ນດຽວກັນ, ການເກັບກໍາຂໍ້ມູນ, ການທົບທວນ, 
  ການຢັ້ງຢືນ, ການຄຸ້ມຄອງ ແລະ ການເຜີຍແຜ່ໄດ້ຖືກຊີ້ນໍາໂດຍກົດຫມາຍວ່າດ້ວຍສະຖິຕິ Lao 
  PDR ປີ 2017 ແລະ ສອດຄ່ອງກັບຫຼັກການພື້ນຖານຂອງອົງການສະຫະປະຊາຊາດຂອງສະຖິຕິທາງການ 
  (FPOS). </p> <p> ລາຍລະອຽດໃນຫນັງສືສະບັບສຸດທ້າຍ.  </p>
