INST_MANDATE: <p>ໂດຍອີງຕາມກົດໝາຍວ່າດ້ວຍສະຖິຕິ ຂອງ ສປປ ລາວ ສະບັບປີ 2010 ແລະ 2017,
  ສູນສະຖິຕິແຫ່ງຊາດ ເປັນຜູ້ຈັດຕັ້ງປະຕິບັດການສຳມະໂນ ແລະ ການສຳຫຼວດຕົວຢ່າງລະດັບຊາດ 
  ພ້ອມທັງການສຳຫຼວດສະເພາະດ້ານອື່ນໆ 
  ທີ່ໄດ້ກຳນົດໄວ້ໃນຍຸດທະສາດການພັດທະນາລະບົບສະຖິຕິແຫ່ງຊາດ (SDNSS) ໃນແຕ່ລະໄລຍະ.</p>
