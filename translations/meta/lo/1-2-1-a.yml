RATIONALE: 
  <p>ການຕິດຕາມຄວາມທຸກຍາກລະດັບຊາດແມ່ນມີຄວາມສຳຄັນຕໍ່ວາລະການພັດທະນາສະເພາະຂອງແຕ່ລະປະເທດ.
  ເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດແມ່ນຖືກນຳໃຊ້ເພື່ອເຮັດໃຫ້ການຄາດຄະເນຄວາມທຸກຍາກມີຄວາມຊັດເຈນ
  ແລະ ສອດຄ່ອງກັບສະພາບການທາງດ້ານເສດຖະກິດ ແລະ ສັງຄົມຂອງປະເທດ ແລະ 
  ບໍ່ໄດ້ມີຈຸດປະສົງເພື່ອໃຊ້ປຽບທຽບອັດຕາຄວາມທຸກຍາກໃນລະດັບສາກົນ.</p>
