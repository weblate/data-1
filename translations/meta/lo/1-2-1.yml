SDG_RELATED_INDICATORS: '<p>ຕົວຊີ້ບອກ 1.1.1: ອັດຕາສ່ວນຂອງປະຊາກອນທີ່ຢູ່ຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກສາກົນ,
  ຈຳແນກຕາມເພດ, ອາຍຸ, ສະຖານະພາບການເຮັດວຽກ ແລະ ທີ່ຕັ້ງທາງພູມສາດ (ຕົວເມືອງ/ຊົນນະບົດ)</p>'
SDG_SERIES_DESCR: '<p>ອັດຕາສ່ວນຂອງປະຊາກອນທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ</p>'
SDG_TARGET: '<p>1.2 ພາຍໃນປີ 2030, ຫຼຸດອັດຕາສ່ວນຂອງຜູ້ຊາຍ, ແມ່ຍິງ ແລະ ເດັກນ້ອຍໃນທຸກເກນອາຍຸ
  ທີ່ດຳລົງຊີວິດໃນຄວາມທຸກຍາກໃນທຸກມິຕິ ຕາມນິຍາມຂອງຊາດ ໃຫ້ຫຼຸດລົງຢ່າງໜ້ອຍເຄິ່ງໜຶ່ງ</p>'
SOURCE_TYPE: '<p>ການສຳຫຼວດດັດຊະນີການບໍລິໂພກ ແລະ ລາຍຈ່າຍຂອງຄົວເຮືອນ ແຫ່ງ ສປປ ລາວ (LECS)</p>'
STAT_CONC_DEF: '<p><strong>ນິຍາມ:</strong></p><p>ອັດຕາຄວາມທຸກຍາກແຫ່ງຊາດ ແມ່ນເປີເຊັນຂອງປະຊາກອນທັງໝົດທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ.
  ອັດຕາຄວາມທຸກຍາກໃນເຂດຊົນນະບົດ ແມ່ນເປີເຊັນຂອງປະຊາກອນໃນເຂດຊົນນະບົດທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ.
  ອັດຕາຄວາມທຸກຍາກໃນຕົວເມືອງ ແມ່ນເປີເຊັນຂອງປະຊາກອນໃນຕົວເມືອງທີ່ດຳລົງຊີວິດຕ່ຳກວ່າເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ.
  </p><p><strong>ແນວຄວາມຄິດ:</strong></p><p>ໃນການປະເມີນຄວາມທຸກຍາກຢູ່ ສປປ ລາວ ແລະ ວິທີການທີ່ດີທີ່ສຸດໃນການຫຼຸດຜ່ອນຄວາມທຸກຍາກຕາມນິຍາມລະດັບຊາດ,
  ແມ່ນເນັ້ນໃສ່ການມີເສັ້ນຄວາມທຸກຍາກທີ່ຖືວ່າເໝາະສົມກັບ ສປປ ລາວ. ເຊັ່ນດຽວກັນ, ຢູ່ພາຍໃນ
  ສປປ ລາວ, ຄວາມແຕກຕ່າງຂອງຄ່າຄອງຊີບໃນແຕ່ລະແຂວງ ແລະ ລະຫວ່າງເຂດຕົວເມືອງ ແລະ ຊົນນະບົດ
  ຕ້ອງໄດ້ຮັບການນຳມາພິຈາລະນາເຂົ້າໃນການກຳນົດເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ.</p>'
QUALITY_ASSMNT: <p>ໂດຍທົ່ວໄປ, ຄຸນນະພາບຂອງຜົນການສຳຫຼວດແມ່ນຖືວ່າຢູ່ໃນລະດັບສູງ 
  ເນື່ອງຈາກມີການຄຸ້ມຄອງຄຸນນະພາບ, ການປະກັນຄຸນນະພາບ ແລະ 
  ມາດຕະຖານທີ່ໄດ້ຈັດຕັ້ງປະຕິບັດ ພ້ອມກັບອັດຕາການຕອບແບບສອບຖາມທີ່ສູງໃນທຸກກຸ່ມ.</p>
QUALITY_MGMNT: <p>ການຄຸ້ມຄອງຄຸນນະພາບຂອງຕົວຊີ້ບອກແມ່ນອີງຕາມກົດໝາຍວ່າດ້ວຍສະຖິຕິ 
