DATA_VALIDATION: '<p>ໄດ້ມີການຈັດຕັ້ງປະຕິບັດບັນດາມາດຕະຖານການທົບທວນ ແລະ ກວດສອບຄວາມຖືກຕ້ອງຂອງຂໍ້ມູນ
  ນັບຕັ້ງແຕ່ການເກັບກຳຂໍ້ມູນ, ການປະມວນຜົນ, ການຄິດໄລ່ ຈົນເຖິງຂັ້ນຕອນສຸດທ້າຍ ແລະ ການເຜີຍແຜ່ຜົນການສຳຫຼວດ.
  </p><p>ເຊັ່ນດຽວກັນ, ກ່ອນຈະເຜີຍແຜ່ຜົນໄດ້ຮັບ ກໍໄດ້ມີຂະບວນການປຶກສາຫາລືກັບບັນດາກະຊວງກ່ຽວຂ້ອງ
  ແລະ ອົງການຄູ່ຮ່ວມງານ ກ່ຽວກັບຂໍ້ມູນລະດັບຊາດທີ່ສະໜອງໃຫ້ແກ່ຕົວຊີ້ບອກ SDGs. </p>'
