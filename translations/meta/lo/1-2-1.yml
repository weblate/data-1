DATA_COMP: '<p> <img src="data:image/png;base64,"/>
  </p> <p> ບ່ອນໃດເປັນຫນ້າທີ່ຕົວຊີ້ວັດທີ່ໃຊ້ເວລາໃນມູນຄ່າ 1 ຖ້າການສະແດງອອກbracketed
  ເປັນຄວາມຈິງ, ແລະ 0 ບໍ່ດັ່ງນັ້ນ. ຖ້າການບໍລິໂພກຫຼືລາຍຮັບຂອງບຸກຄົນແມ່ນຫນ້ອຍກວ່າເສັ້ນຄວາມທຸກຍາກຂອງຊາດ
  (ຕົວຢ່າງ, ໃນແງ່ທີ່ແນ່ນອນເສັ້ນອາດຈະເປັນລາຄາຂອງວົງເງິນການບໍລິໂພກຫຼືໃນແງ່ທີ່ສົມທຽບເປັນເປີເຊັນຂອງການແຈກຢາຍລາຍຮັບ),
  ແລ້ວແມ່ນເທົ່າກັບ 1 ແລະບຸກຄົນແມ່ນນັບວ່າທຸກຍາກ.  ເປັນຈໍານວນທັງຫມົດ, ຕົວເມືອງ ຫຼື ຊົນນະບົດຂອງຄົນທຸກຍາກ.
  ເປັນຈໍານວນທັງຫມົດ, ຕົວເມືອງ ຫຼື ຊົນນະບົດ. </p> <p> ອັດຕາຄວາມທຸກຍາກຂອງຊາດໃຊ້ເສັ້ນຄວາມທຸກຍາກສະເພາະປະເທດ,
  ສະທ້ອນໃຫ້ເຫັນສະພາບການເສດຖະກິດ-ສັງຄົມຂອງປະເທດ. </p>'
