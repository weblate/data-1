CLASS_SYSTEM: '<p>ບໍ່ມີ</p>'
COLL_METHOD: '<p>ການສຳຫຼວດດັດຊະນີການບໍລິໂພກ ແລະ ລາຍຈ່າຍຂອງຄົວເຮືອນ (LECS) ສົກປີ 2018-2019
  ແມ່ນການສຳຫຼວດຄັ້ງທີ 6 ແລະ ເປັນຄັ້ງຫຼ້າສຸດທີ່ຈັດຕັ້ງປະຕິບັດຢູ່ ສປປ ລາວ. </p><p><strong>ວິທີການສຳຫຼວດ
  ແລະ ຂອບເຂດກວມເອົາ</strong>: ແມ່ນການສຳຫຼວດແບບສຸ່ມຕົວຢ່າງ ທີ່ຈັດຕັ້ງປະຕິບັດໃນທົ່ວປະເທດ
  ຢູ່ທຸກໆແຂວງ (17 ແຂວງ) ແລະ ທຸກເມືອງ. </p><p><strong>ການລົງເກັບກຳຂໍ້ມູນພາກສະໜາມ</strong>:
  ໃຊ້ເວລາ 12 ເດືອນ, ເລີ່ມແຕ່ເດືອນມິຖຸນາ 2018 ຫາ ເດືອນມິຖຸນາ 2019 (ຄັ້ງຫຼ້າສຸດ)</p><p><em>ຂໍ້ມູນລາຍຈ່າຍ
  ແລະ ລາຍຮັບຂອງຄົວເຮືອນ</em> ແມ່ນໄດ້ເກັບກຳໃນທຸກໆເດືອນ ໂດຍນຳໃຊ້ຫຼັກການບັນທຶກປະຈຳວັນ.
  ທຸກລາຍການເຄື່ອນໄຫວແມ່ນໄດ້ບັນທຶກໄວ້ໃນປຶ້ມຕິດຕາມ ແລະ ຈັດແບ່ງປະເພດຕາມລັກສະນະການບໍລິໂພກ
  ຫຼື ຕາມຜົນຜະລິດກະສິກຳ ແລະ ທຸລະກິດຂອງຄົວເຮືອນ. <em>ຂໍ້ມູນການຊື້ສິນຄ້າ</em> ທີ່ມີອາຍຸການນຳໃຊ້ຍາວນານ
  (ສິນຄ້າຄົງທົນ) ເຊັ່ນ: ເຄື່ອງເຟີນີເຈີ, ໂທລະພາບ, ລົດໃຫຍ່, ລົດຈັກ ແລະ ອື່ນໆ ກໍໄດ້ຮັບການບັນທຶກສຳລັບໄລຍະ
  12 ເດືອນທີ່ຜ່ານມາ. <em>ຂໍ້ມູນການນຳໃຊ້ເວລາ</em> ແມ່ນໄດ້ເກັບກຳໃນໄລຍະກາງເດືອນ ສຳລັບສະມາຊິກຄົວເຮືອນທຸກຄົນທີ່ມີອາຍຸແຕ່
  10 ປີຂຶ້ນໄປ.</p><p><strong>ຮູບແບບການສຳພາດ:</strong> ການສຳພາດແບບເຊິ່ງໜ້າ </p><p><strong>ການກວດກາຊຸກຍູ້:
  </strong>ແຕ່ລະທີມປະກອບມີ ຜູ້ກວດກາ 1 ຄົນ ແລະ ພະນັກງານເກັບກຳຂໍ້ມູນ 2 ຄົນ ຕໍ່ແຕ່ລະບ້ານ.
  </p><p><strong>ໝາຍເຫດການເກັບກຳຂໍ້ມູນ: </strong>ການຝຶກອົບຮົມໃຫ້ແກ່ຄູຝຶກ ແລະ ຜູ້ກວດກາ
  ແມ່ນໄດ້ຈັດຂຶ້ນເປັນເວລາ 5 ວັນ ຢູ່ສູນສະຖິຕິແຫ່ງຊາດ, ນະຄອນຫຼວງວຽງຈັນ, ໂດຍມີການເຂົ້າຮ່ວມຂອງພະນັກງານທັງໝົດຈາກຂະແໜງສະຖິຕິ
  17 ແຂວງ. ການຝຶກອົບຮົມພະນັກງານເກັບກຳຂໍ້ມູນແມ່ນໃຊ້ເວລາ 11 ວັນ ເພື່ອໃຫ້ກວມເອົາທັງໝົດ
  17 ແຂວງ. </p><p><strong>ຂັ້ນຕອນການສຸ່ມຕົວຢ່າງ</strong>: ການອອກແບບ ແລະ ການຄັດເລືອກຕົວຢ່າງ
  (ການສຸ່ມຕົວຢ່າງແບບສອງຂັ້ນຕອນ)</p><p>ຂັ້ນຕອນທີໜຶ່ງ: ການກຳນົດລາຍລະອຽດຂອງບ້ານຕົວຢ່າງ;
  ຂັ້ນຕອນທີສອງ: ການຄັດເລືອກຄົວເຮືອນຕົວຢ່າງ ພາຍໃນບ້ານທີ່ຖືກສຸ່ມຕົວຢ່າງແລ້ວ</p><h2><strong>ແບບສອບຖາມ</strong></h2><p>ແບບສອບຖາມ
  4 ຊຸດ ທີ່ນຳໃຊ້ເຂົ້າໃນການເກັບກຳຂໍ້ມູນ LECS VI ມີ:<br/>- ແບບສອບຖາມຄົວເຮືອນ<br/>- ໃບບັນທຶກປະຈຳວັນ<br/>-
  ແບບສອບຖາມການນຳໃຊ້ເວລາ<br/>- ແບບສອບຖາມຂັ້ນບ້ານ<br/>- ແບບສອບຖາມລາຄາ </p><p>ສຳລັບລາຍລະອຽດດ້ານລະບຽບວິທີການ,
  ກະລຸນາເບິ່ງບົດລາຍງານການສຳຫຼວດ </p><p>(ມີລິ້ງໃຫ້ຢູ່ໃນພາກສ່ວນເອກະສານອ້າງອີງ).</p>'
