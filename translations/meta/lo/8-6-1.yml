STAT_CONC_DEF: 
  <p><strong>ນິຍາມ:</strong></p><p>ຕົວຊີ້ບອກນີ້ສະແດງເຖິງອັດຕາສ່ວນຂອງຊາວໜຸ່ມ 
  (ອາຍຸ 15-24 ປີ) ທີ່ບໍ່ໄດ້ຢູ່ໃນລະບົບການສຶກສາ, ການຈ້າງງານ ຫຼື ການຝຶກອົບຮົມ 
  (ເຊິ່ງເອີ້ນກັນວ່າ "ອັດຕາຊາວໜຸ່ມ 
  NEET").</p><p><strong>ແນວຄວາມຄິດ:</strong></p><p>ສຳລັບຈຸດປະສົງຂອງຕົວຊີ້ບອກນີ້,
  ຊາວໜຸ່ມ ແມ່ນຖືກນິຍາມວ່າເປັນບຸກຄົນທັງໝົດທີ່ມີອາຍຸລະຫວ່າງ 15 ຫາ 24 ປີ 
  (ລວມທັງອາຍຸ 15 ແລະ 24 ປີ). ອີງຕາມການຈັດປະເພດມາດຕະຖານການສຶກສາສາກົນ (ISCED), 
  ການສຶກສາ ຖືກນິຍາມວ່າເປັນການສື່ສານທີ່ມີການຈັດຕັ້ງ ແລະ ຕໍ່ເນື່ອງ 
  ເຊິ່ງອອກແບບມາເພື່ອໃຫ້ເກີດການຮຽນຮູ້. ການສຶກສາໃນລະບົບ ຖືກນິຍາມໄວ້ໃນ ISCED 
  ວ່າເປັນການສຶກສາທີ່ມີລັກສະນະເປັນສະຖາບັນ, ມີຄວາມຕັ້ງໃຈ ແລະ 
  ມີການວາງແຜນຜ່ານອົງການຈັດຕັ້ງຂອງລັດ ແລະ ໜ່ວຍງານເອກະຊົນທີ່ໄດ້ຮັບການຮັບຮອງ ແລະ 
  ໂດຍລວມແລ້ວ ແມ່ນປະກອບເປັນລະບົບການສຶກສາໃນລະບົບຂອງປະເທດ.</p><p>ການສຶກສານອກລະບົບ, 
  ເຊັ່ນດຽວກັບການສຶກສາໃນລະບົບ ແມ່ນຖືກນິຍາມໄວ້ໃນ ISCED 
  ວ່າເປັນການສຶກສາທີ່ມີລັກສະນະເປັນສະຖາບັນ, ມີຄວາມຕັ້ງໃຈ ແລະ 
  ມີການວາງແຜນໂດຍຜູ້ສະໜອງການສຶກສາ ແຕ່ຖືກພິຈາລະນາວ່າເປັນການເພີ່ມເຕີມ, ທາງເລືອກ 
  ແລະ/ຫຼື ການເສີມສ້າງໃຫ້ແກ່ການສຶກສາໃນລະບົບ. ມັນອາດຈະມີໄລຍະເວລາສັ້ນ ແລະ/ຫຼື 
  ມີຄວາມເຂັ້ມຂຸ້ນຕ່ຳ ແລະ ໂດຍທົ່ວໄປແລ້ວຈະຈັດຂຶ້ນໃນຮູບແບບຂອງຫຼັກສູດໄລຍະສັ້ນ, 
  ກອງປະຊຸມຝຶກອົບຮົມ ຫຼື ງານສຳມະນາ. ການຮຽນຮູ້ຕາມອັດທະຍາໄສ ຖືກນິຍາມໄວ້ໃນ ISCED 
  ວ່າເປັນຮູບແບບການຮຽນຮູ້ທີ່ມີຄວາມຕັ້ງໃຈ ຫຼື ເຈດຕະນາ, ແຕ່ບໍ່ມີລັກສະນະເປັນສະຖາບັນ.
  ດັ່ງນັ້ນ ມັນຈຶ່ງມີການຈັດຕັ້ງ ແລະ ມີໂຄງສ້າງໜ້ອຍກວ່າການສຶກສາໃນລະບົບ ຫຼື 
  ການສຶກສານອກລະບົບ. ການຮຽນຮູ້ຕາມອັດທະຍາໄສ 
  ອາດຈະລວມມີກິດຈະກຳການຮຽນຮູ້ທີ່ເກີດຂຶ້ນໃນຄອບຄົວ, ສະຖານທີ່ເຮັດວຽກ, ຊຸມຊົນທ້ອງຖິ່ນ
  ແລະ ໃນຊີວິດປະຈຳວັນ, ໂດຍອີງໃສ່ການຊີ້ນຳດ້ວຍຕົນເອງ, ການຊີ້ນຳຈາກຄອບຄົວ ຫຼື 
  ການຊີ້ນຳຈາກສັງຄົມ. ສຳລັບຈຸດປະສົງຂອງຕົວຊີ້ບອກນີ້, 
  ບຸກຄົນຈະຖືກພິຈາລະນາວ່າຢູ່ໃນລະບົບການສຶກສາ ຖ້າພວກເຂົາຢູ່ໃນການສຶກສາໃນລະບົບ ຫຼື 
  ນອກລະບົບ, ດັ່ງທີ່ໄດ້ອະທິບາຍໄວ້ຂ້າງເທິງ, 
  ແຕ່ບໍ່ລວມເຖິງການຮຽນຮູ້ຕາມອັດທະຍາໄສ.</p><p>ການຈ້າງງານ 
  ຖືກນິຍາມວ່າແມ່ນບຸກຄົນທັງໝົດທີ່ຢູ່ໃນເກນອາຍຸອອກແຮງງານ 
  ເຊິ່ງໃນໄລຍະເວລາອ້າງອີງສັ້ນໆ (ໜຶ່ງອາທິດ), 
  ໄດ້ມີສ່ວນຮ່ວມໃນກິດຈະກຳໃດໜຶ່ງເພື່ອຜະລິດສິນຄ້າ ຫຼື 
  ໃຫ້ການບໍລິການເພື່ອແລກກັບຄ່າຈ້າງ ຫຼື ກຳໄລ.</p><p>ສຳລັບຈຸດປະສົງຂອງຕົວຊີ້ບອກນີ້, 
  ບຸກຄົນຈະຖືກພິຈາລະນາວ່າຢູ່ໃນການຝຶກອົບຮົມ 
  ຖ້າພວກເຂົາຢູ່ໃນກິດຈະກຳການຮຽນຮູ້ທີ່ບໍ່ແມ່ນທາງວິຊາການ ເຊິ່ງຜ່ານກິດຈະກຳດັ່ງກ່າວ 
  ພວກເຂົາຈະໄດ້ຮັບທັກສະສະເພາະທີ່ແນໃສ່ສຳລັບວຽກງານວິຊາຊີບ ຫຼື 
  ເຕັກນິກ.</p><p>ການຝຶກອົບຮົມວິຊາຊີບ 
  ແມ່ນການກະກຽມຜູ້ເຂົ້າຮັບການຝຶກອົບຮົມສຳລັບວຽກງານທີ່ອີງໃສ່ກິດຈະກຳທີ່ໃຊ້ແຮງງານ ຫຼື
  ພາກປະຕິບັດ, ແລະ ສຳລັບວຽກງານປະຕິບັດການທີ່ມີທັກສະ, ທັງວຽກທີ່ໃຊ້ແຮງງານ ແລະ 
  ວຽກຫ້ອງການ ທີ່ກ່ຽວຂ້ອງກັບວິຊາສະເພາະ, ໜ້າທີ່ການງານ ຫຼື ວິຊາຊີບໃດໜຶ່ງ. 
  ໃນທາງກົງກັນຂ້າມ ການຝຶກອົບຮົມດ້ານເຕັກນິກ 
  ແມ່ນການຖ່າຍທອດການຮຽນຮູ້ທີ່ສາມາດນຳໄປນຳໃຊ້ໃນວຽກງານລະດັບກາງ, 
  ໂດຍສະເພາະວຽກງານຂອງນັກເຕັກນິກ ແລະ ຜູ້ຈັດການລະດັບກາງ.</p>
