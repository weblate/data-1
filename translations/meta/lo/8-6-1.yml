DATA_COMP: <p>ອັດຕາຊາວໜຸ່ມ NEET = ( ຊາວໜຸ່ມ –(ຊາວໜຸ່ມທີ່ມີການຈ້າງງານ + 
  ຊາວໜຸ່ມທີ່ບໍ່ມີການຈ້າງງານ ແຕ່ຢູ່ໃນລະບົບການສຶກສາ ຫຼື ການຝຶກອົບຮົມ))/ຊາວໜຸ່ມ 
  ×100</p><p>ສິ່ງສຳຄັນທີ່ຄວນສັງເກດໃນທີ່ນີ້ຄື ຊາວໜຸ່ມທີ່ມີການຈ້າງງານ ແລະ 
  ຢູ່ໃນລະບົບການສຶກສາ ຫຼື ການຝຶກອົບຮົມໃນເວລາດຽວກັນນັ້ນ ບໍ່ຄວນຖືກນັບຊ້ຳ 
  ເມື່ອລົບອອກຈາກຈຳນວນຊາວໜຸ່ມທັງໝົດ. ສູດດັ່ງກ່າວ 
  ຍັງສາມາດສະແດງໄດ້ດັ່ງນີ້:</p><p>ອັດຕາຊາວໜຸ່ມ NEET = ((ຊາວໜຸ່ມທີ່ວ່າງງານ + 
  ຊາວໜຸ່ມທີ່ຢູ່ນອກກຳລັງແຮງງານ) – (ຊາວໜຸ່ມທີ່ວ່າງງານທີ່ຢູ່ໃນລະບົບການສຶກສາ ຫຼື 
  ການຝຶກອົບຮົມ + ຊາວໜຸ່ມທີ່ຢູ່ນອກກຳລັງແຮງງານທີ່ຢູ່ໃນລະບົບການສຶກສາ ຫຼື 
  ການຝຶກອົບຮົມ) )/ຊາວໜຸ່ມ ×100</p>
