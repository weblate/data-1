REC_USE_LIM: <p>ການຄິດໄລ່ຕົວຊີ້ບອກນີ້ຮຽກຮ້ອງໃຫ້ມີຂໍ້ມູນທີ່ເຊື່ອຖືໄດ້ 
  ທັງໃນດ້ານສະຖານະພາບໃນຕະຫຼາດແຮງງານ ແລະ ການເຂົ້າຮ່ວມໃນການສຶກສາ ຫຼື 
  ການຝຶກອົບຮົມຂອງຊາວໜຸ່ມ. 
  ຄຸນນະພາບຂອງຂໍ້ມູນດັ່ງກ່າວແມ່ນຂຶ້ນກັບການອອກແບບແບບສອບຖາມ, ຂະໜາດ ແລະ 
  ການອອກແບບກຸ່ມຕົວຢ່າງ ແລະ 
  ຄວາມຖືກຕ້ອງຂອງຄຳຕອບຈາກຜູ້ຕອບ.</p><p>ໃນດ້ານການວິເຄາະຕົວຊີ້ບອກນີ້, 
  ເພື່ອຫຼີກລ່ຽງການຕີຄວາມໝາຍຜິດ, ສິ່ງສຳຄັນທີ່ຄວນຄຳນຶງເຖິງຄື 
  ມັນປະກອບດ້ວຍສອງກຸ່ມຍ່ອຍທີ່ແຕກຕ່າງກັນ 
  (ຊາວໜຸ່ມທີ່ວ່າງງານທີ່ບໍ່ໄດ້ຢູ່ໃນລະບົບການສຶກສາ ຫຼື ການຝຶກອົບຮົມ ແລະ 
  ຊາວໜຸ່ມທີ່ຢູ່ນອກກຳລັງແຮງງານທີ່ບໍ່ໄດ້ຢູ່ໃນລະບົບການສຶກສາ ຫຼື ການຝຶກອົບຮົມ). 
  ອັດຕາຄວາມແຜ່ຫຼາຍ ແລະ ອົງປະກອບຂອງແຕ່ລະກຸ່ມຍ່ອຍ ຈະມີຜົນສະທ້ອນທາງນະໂຍບາຍ, ແລະ 
  ດັ່ງນັ້ນ ຈຶ່ງຄວນໄດ້ຮັບການພິຈາລະນາເຊັ່ນກັນໃນເວລາວິເຄາະອັດຕາ NEET.</p>
RATIONALE: <p>ອັດຕາສ່ວນຂອງຊາວໜຸ່ມທີ່ບໍ່ມີວຽກເຮັດ, ບໍ່ໄດ້ຮັບການສຶກສາ ຫຼື 
  ຝຶກອົບຮົມ (ອັດຕາຊາວໜຸ່ມ NEET) ແມ່ນຕົວວັດແທກເຖິງຊາວໜຸ່ມທີ່ຢູ່ນອກລະບົບການສຶກສາ, 
  ບໍ່ໄດ້ຝຶກອົບຮົມ ແລະ ບໍ່ມີວຽກເຮັດ, ແລະ ດັ່ງນັ້ນ 
  ມັນຈຶ່ງເປັນຕົວວັດແທກທີ່ກວ້າງກວ່າສຳລັບຊາວໜຸ່ມທີ່ມີທ່າແຮງໃນການເຂົ້າສູ່ຕະຫຼາດແຮງງານ
  ເມື່ອທຽບກັບອັດຕາການວ່າງງານຂອງຊາວໜຸ່ມ. 
  ມັນໄດ້ລວມເອົາຜູ້ອອກແຮງງານຊາວໜຸ່ມທີ່ທໍ້ຖອຍໃຈ 
  ຕະຫຼອດຮອດຜູ້ທີ່ຢູ່ນອກກຳລັງແຮງງານເນື່ອງຈາກຄວາມພິການ ຫຼື 
  ຕິດພັນກັບການເຮັດວຽກເຮືອນ, ລວມເຖິງເຫດຜົນອື່ນໆ. ຊາວໜຸ່ມ NEET 
  ຍັງເປັນຕົວວັດແທກທີ່ດີກວ່າສຳລັບກຸ່ມຊາວໜຸ່ມທັງໝົດໃນປັດຈຸບັນ 
  ທີ່ມີທ່າແຮງໃນການເຂົ້າສູ່ຕະຫຼາດແຮງງານ 
  ເມື່ອທຽບກັບອັດຕາຊາວໜຸ່ມທີ່ບໍ່ເຄື່ອນໄຫວທາງເສດຖະກິດ, ເພາະວ່າອັດຕາຢ່າງຫຼັງນີ້ 
  ແມ່ນໄດ້ລວມເອົາຊາວໜຸ່ມທີ່ຢູ່ນອກກຳລັງແຮງງານແຕ່ຍັງຢູ່ໃນລະບົບການສຶກສາ, 
  ເຊິ່ງພວກເຂົາກຳລັງພັດທະນາທັກສະ ແລະ ຄຸນວຸດທິຂອງຕົນເອງຢູ່.</p>
