COLL_METHOD: '<p>ການສຳຫຼວດກຳລັງແຮງງານ ທີ່ຈັດຕັ້ງປະຕິບັດຢູ່ ສາທາລະນະລັດ ປະຊາທິປະໄຕ
  ປະຊາຊົນລາວ ໃນປີ 2017 (LFS 2017) ແມ່ນໄດ້ນຳໃຊ້ແນວຄວາມຄິດໃໝ່ກ່ຽວກັບ ວຽກງານ, ການຈ້າງງານ
  ແລະ ການນຳໃຊ້ກຳລັງແຮງງານບໍ່ເຕັມສ່ວນ ທີ່ໄດ້ຮັບຮອງເອົາໂດຍ ກອງປະຊຸມສາກົນຂອງນັກສະຖິຕິແຮງງານ
  ຄັ້ງທີ 19 (ICLS) ໃນປີ 2013.</p><h2><strong>ການສຸ່ມຕົວຢ່າງ</strong></h2><p>ຂັ້ນຕອນການສຸ່ມຕົວຢ່າງ</p><p>ການສຳມະໂນປະຊາກອນ
  ແລະ ທີ່ຢູ່ອາໄສ ປີ 2015 ແມ່ນໄດ້ຖືກນຳໃຊ້ເຂົ້າໃນໂຄງຮ່າງການສຸ່ມຕົວຢ່າງ ສຳລັບ LFS 2017.
  ອີງຕາມການສຳມະໂນ, ສປປ ລາວ ມີປະຊາກອນທັງໝົດ 6,479,982 ຄົນ ແບ່ງອອກເປັນ 1,197,926 ຄົວເຮືອນ.
  ແຂວງສະຫວັນນະເຂດ ມີປະຊາກອນຫຼາຍທີ່ສຸດ ແຕ່ ນະຄອນຫຼວງວຽງຈັນ ມີຈຳນວນຄົວເຮືອນຫຼາຍທີ່ສຸດ.
  ປະຊາກອນໃນແຂວງໄຊສົມບູນ ແມ່ນໜ້ອຍທີ່ສຸດ ຄື 85,168 ຄົນ, ແລະ ແຂວງດັ່ງກ່າວຍັງມີຈຳນວນຄົວເຮືອນໜ້ອຍທີ່ສຸດ
  ຄື 14,316.<br/><br/>ໄດ້ມີການສະເໜີໃຫ້ໃຊ້ການສຸ່ມຕົວຢ່າງແບບສອງຂັ້ນຕອນ, ໂດຍມີການຄັດເລືອກເອົາບ້ານໃນ
  </p><ul><li>ຂັ້ນຕອນທີໜຶ່ງ ແລະ ການຄັດເລືອກຄົວເຮືອນໃນຂັ້ນຕອນທີສອງ. ໃນຂອບເຂດລະດັບແຂວງ,
  ບ້ານຕ່າງໆໄດ້ຖືກຄັດເລືອກໂດຍໃຊ້ວິທີ PPS (ບໍ່ຈຳເປັນຕ້ອງມີການຈັດແບ່ງຊັ້ນ ເນື່ອງຈາກມີຈຳນວນບ້ານໜ້ອຍພາຍໃນແຕ່ລະແຂວງ).
  </li><li>ການສຸ່ມຕົວຢ່າງຂັ້ນຕອນທີສອງ ປະກອບມີການຄັດເລືອກແບບເປັນລະບົບ ເອົາ 20 ຄົວເຮືອນ
  ຈາກບັນຊີລາຍຊື່ຄົວເຮືອນທີ່ໄດ້ປັບປຸງໃໝ່ ຈາກການສຳມະໂນປີ 2015. ເປົ້າໝາຍໃນລະດັບແຂວງແມ່ນ
  10,800 ຄົວເຮືອນຕົວຢ່າງ ໂດຍມີຄ່າຜິດດ່ຽງທີ່ຍອມຮັບໄດ້ຢູ່ທີ່ 3% ແລະ 6%. </li></ul><p><strong>ການເກັບກຳຂໍ້ມູນ:
  </strong>ເລີ່ມ: 2017, ສິ້ນສຸດ: 2017</p><p><strong>ຮູບແບບການເກັບກຳຂໍ້ມູນ: </strong>ແບບເຊິ່ງໜ້າ
  (Face-to-Face)</p>'
