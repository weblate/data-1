SDG_GOAL: '<p>SDG 8: ວຽກງານທີ່ມີຄຸນຄ່າ ແລະ ການເຕີບໂຕທາງດ້ານເສດຖະກິດ: ສົ່ງເສີມການເຕີບໂຕທາງດ້ານເສດຖະກິດທີ່ຕໍ່ເນື່ອງ,
  ທຸກພາກສ່ວນມີສ່ວນຮ່ວມ ແລະ ຍືນຍົງ, ການຈ້າງງານທີ່ເຕັມສ່ວນ ແລະ ມີຜະລິດທະພາບ ແລະ ວຽກງານທີ່ມີຄຸນຄ່າສຳລັບທຸກຄົນ</p>'
