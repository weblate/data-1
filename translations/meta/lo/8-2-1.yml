  Base on the Census, Lao PDR ມີປະຊາກອນທັງຫມົດ 6,479,982 ແຈກອອກເປັນ 1,197,926 ຄົວເຮືອນ
  . ແຂວງສາລະວັນມີປະຊາກອນຫຼາຍທີ່ສຸດ ແຕ່Vientiane Capital ມີຄົວເຮືອນຫຼາຍທີ່ສຸດ. ປະຊາກອນໃນເມືອງສີທອງຕ່ໍາສຸດຢູ່ທີ່
  85,168, ແຂວງຍັງມີຈໍານວນຄົວເຮືອນຕໍ່າສຸດໃນຈໍານວນ 14,316. <br/> <br/> ສະເຫນີຕົວຢ່າງສອງຂັ້ນ,
  ໂດຍມີການຄັດເລືອກຫມູ່ບ້ານໃນ </p><ul><li><li>ຂັ້ນຕອນທໍາອິດແລະການຄັດເລືອກຂອງຄົວເຮືອນໃນຂັ້ນຕອນທີສອງ.
  ໃນເຂດປົກຄອງແຂວງ, ມີການຄັດເລືອກຫມູ່ບ້ານໂດຍໃຊ້ PPS (ບໍ່ຈໍາເປັນຕ້ອງມີສະຕິເນື່ອງຈາກວ່າມີຫມູ່ບ້ານພາຍໃນແຕ່ລະແຂວງຫນ້ອຍລົງ).
