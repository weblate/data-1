INST_MANDATE: <p>ອີງຕາມກົດໝາຍວ່າດ້ວຍສະຖິຕິ ແລະ ຍຸດທະສາດແຫ່ງຊາດ 
  ເພື່ອການພັດທະນາລະບົບສະຖິຕິແບບຍືນຍົງ 2016-2020 ແລະ ວິໄສທັດຮອດປີ 2030, 
  ກະຊວງແຜນການ ແລະ ການລົງທຶນ ໂດຍຜ່ານສູນສະຖິຕິແຫ່ງຊາດ ຮ່ວມກັບ ກະຊວງແຮງງານ ແລະ 
  ສະຫວັດດີການສັງຄົມ ໄດ້ຈັດຕັ້ງປະຕິບັດການສຳຫຼວດກຳລັງແຮງງານລາວ ໃນປີ 2017.</p>
